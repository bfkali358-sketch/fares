<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FARES</title>
<style>
body {
  background: #101522;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 30px 15px;
}
.card {
  max-width: 380px;
  margin: 60px auto;
  padding: 25px;
  background: #1d293b;
  border-radius: 15px;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
}
button {
  background: #1687e8;
  color: white;
  font-weight: bold;
}
#message { color: #ffd166; }
#account { display: none; }
</style>
</head>
<body>

<div class="card" id="loginCard">
  <h1>FARES</h1>
  <p>مرحبًا بك، سجل الدخول للمتابعة</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button id="loginButton">تسجيل الدخول</button>
  <p id="message"></p>
</div>

<div class="card" id="account">
  <h1>FARES</h1>
  <h2 id="name"></h2>
  <p id="welcome"></p>
  <button id="logoutButton">تسجيل الخروج</button>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://efkmivrlmxeigaspsyvv.supabase.co',
  'sb_publishable_gxtkpfrl0a81ozdke2BLQQ_eT54Wn5e'
);

const message = document.getElementById('message');

async function showAccount(user) {
  const { data, error } = await supabase
    .from('profiles')
    .select('name, welcome_message, is_developer')
    .eq('id', user.id)
    .single();

  if (error || !data) {
    message.textContent = 'لم يتم العثور على ملف الحساب';
    return;
  }

  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('account').style.display = 'block';
  document.getElementById('name').textContent = data.name;
  document.getElementById('welcome').textContent =
    data.welcome_message;
}

document.getElementById('loginButton').onclick = async () => {
  message.textContent = 'جارٍ تسجيل الدخول...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = 'فشل تسجيل الدخول: تحقق من البيانات';
    return;
  }

  await showAccount(data.user);
};

document.getElementById('logoutButton').onclick = async () => {
  await supabase.auth.signOut();
  location.reload();
};

const { data } = await supabase.auth.getSession();

if (data.session) {
  await showAccount(data.session.user);
}
</script>
</body>
</html>
