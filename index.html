<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FARES</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b1120;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #151f33;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #35a5ff;
  font-size: 27px;
  font-weight: bold;
}

.card {
  background: #17243a;
  max-width: 430px;
  margin: 35px auto;
  padding: 25px;
  border-radius: 18px;
  text-align: center;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
  font-size: 16px;
}

input {
  background: #0b1120;
  color: white;
}

button {
  background: #1687e8;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #086bc0;
}

#message { color: #ffd166; }

#account { display: none; }

.welcome {
  background: #213653;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

footer {
  text-align: center;
  color: #8290a5;
  margin-top: 60px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">FARES</div>
  <div>منصتك الخاصة</div>
</header>

<div class="card" id="loginCard">
  <h2>مرحباً بك في FARES</h2>
  <p>سجل الدخول إلى حسابك</p>

  <input id="email" type="email"
  placeholder="البريد الإلكتروني">

  <input id="password" type="password"
  placeholder="كلمة المرور">

  <button id="loginButton">تسجيل الدخول</button>
  <p id="message"></p>
</div>

<div class="card" id="account">
  <h2>مرحباً بك 👋</h2>

  <div class="welcome">
    <h2 id="name"></h2>
    <p id="welcome"></p>
  </div>

  <button id="logoutButton">تسجيل الخروج</button>
</div>

<footer>
  FARES © 2026
</footer>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://efkmivrlmxeigaspsyvv.supabase.co',
  'sb_publishable_gxtkpfrl0a81ozdke2BLQQ_eT54Wn5e'
);

const message = document.getElementById('message');

async function showAccount(user) {
  const { data, error } = await supabase
    .from('profiles')
    .select('name, welcome_message, is_developer')
    .eq('id', user.id)
    .single();

  if (error || !data) {
    message.textContent = 'لم يتم العثور على ملف الحساب';
    return;
  }

  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('account').style.display = 'block';

  document.getElementById('name').textContent = data.name;
  document.getElementById('welcome').textContent =
    data.welcome_message;
}

document.getElementById('loginButton').onclick = async () => {
  message.textContent = 'جارٍ تسجيل الدخول...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = 'فشل تسجيل الدخول: تحقق من البيانات';
    return;
  }

  await showAccount(data.user);
};

document.getElementById('logoutButton').onclick = async () => {
  await supabase.auth.signOut();
  location.reload();
};

const { data } = await supabase.auth.getSession();

if (data.session) {
  await showAccount(data.session.user);
}
</script>

</body>
</html>
