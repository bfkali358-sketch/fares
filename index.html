
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FARES</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;font-family:Arial;color:white;
 background:linear-gradient(135deg,#050b20,#102c59,#071225);
}
.card{
 max-width:430px;width:100%;padding:35px 25px;text-align:center;
 border:1px solid #ffffff40;border-radius:25px;
 background:#ffffff12;box-shadow:0 15px 50px #0008;
}
.logo{
 width:80px;height:80px;margin:auto;display:grid;place-items:center;
 border-radius:22px;background:linear-gradient(135deg,#1677ff,#52c5ff);
 font-size:45px;font-weight:bold;
}
h1{letter-spacing:6px}
p{line-height:2;color:#d4e3ff}
</style>
</head>
<body>
<div class="card">
 <div class="logo">F</div>
 <h1>FARES</h1>
 <p>مرحبا بكم في موقعي الرسمي</p>
 <p>الموقع من صنع فارس ❤️</p>
</div>
</body>
</html>
