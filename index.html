
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FARES 💙</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #081225;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 22px;
      background: #14213b;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
      color: #55b7ff;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input, select {
      background: #263754;
      color: white;
    }

    button {
      background: #1685e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #account {
      display: none;
    }

    #chatMessages {
      height: 300px;
      overflow-y: auto;
      background: #091426;
      padding: 12px;
      border-radius: 10px;
      margin: 12px 0;
    }

    .message {
      background: #263754;
      padding: 10px;
      border-radius: 10px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .mine {
      background: #075b9c;
    }

    .status {
      text-align: center;
      color: #80caff;
      overflow-wrap: anywhere;
      min-height: 22px;
    }

    small {
      color: #c3d5e8;
    }

    hr {
      border: 1px solid #334663;
      margin: 22px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>FARES 💙</h1>

    <div id="loginCard">
      <h2>تسجيل الدخول</h2>

      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">

      <button id="loginButton">دخول</button>
      <p id="loginStatus" class="status"></p>
    </div>

    <div id="account">
      <h2>مرحباً <span id="name"></span></h2>
      <p id="welcome" class="status"></p>

      <button id="logoutButton">تسجيل الخروج</button>

      <hr>

      <h2>محادثات FARES 💬</h2>

      <select id="users">
        <option value="">اختر مستخدماً</option>
      </select>

      <div id="chatMessages">
        <p class="status">اختر مستخدماً لبدء المحادثة</p>
      </div>

      <input id="chatInput" maxlength="1000" placeholder="اكتب رسالتك">

      <button id="sendButton">إرسال الرسالة</button>
      <button id="refreshButton">تحديث المحادثة</button>

      <p id="status" class="status"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL =
      'https://efkmivrlmxeigaspsyvv.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_gxtkpfrl0a81ozdke2BLQQ_eT54Wn5e';

    const el = id => document.getElementById(id);

    let supabaseClient = null;
    let currentUser = null;
    let currentName = '';

    function loginMessage(message) {
      el('loginStatus').textContent = message;
    }

    function chatMessage(message) {
      el('status').textContent = message;
    }

    function showError(prefix, error) {
      console.error(prefix, error);
      return prefix + (error?.message || 'حدث خطأ غير معروف');
    }

    async function showAccount(user) {
      currentUser = user;

      const { data, error } = await supabaseClient
        .from('profiles')
        .select('name, welcome_message')
        .eq('id', user.id)
        .single();

      if (error || !data) {
        currentUser = null;
        loginMessage(showError('تعذر تحميل الحساب: ', error));
        return;
      }

      currentName = data.name;

      el('loginCard').style.display = 'none';
      el('account').style.display = 'block';
      el('name').textContent = data.name;
      el('welcome').textContent = data.welcome_message;

      await loadUsers();
    }

    async function loadUsers() {
      if (!currentUser) return;

      chatMessage('جار تحميل المستخدمين...');

      const { data, error } = await supabaseClient
        .from('profiles')
        .select('id, name')
        .neq('id', currentUser.id)
        .order('name');

      if (error) {
        chatMessage(showError('خطأ تحميل المستخدمين: ', error));
        return;
      }

      const select = el('users');
      select.innerHTML = '';

      const firstOption = document.createElement('option');
      firstOption.value = '';
      firstOption.textContent = 'اختر مستخدماً';
      select.appendChild(firstOption);

      data.forEach(user => {
        const option = document.createElement('option');
        option.value = user.id;
        option.textContent = user.name;
        select.appendChild(option);
      });

      chatMessage(
        data.length ? 'تم تحميل المستخدمين' : 'لا يوجد مستخدمون آخرون'
      );
    }

    async function loadMessages() {
      if (!currentUser) return;

      const receiver = el('users').value;

      if (!receiver) {
        el('chatMessages').textContent =
          'اختر مستخدماً لبدء المحادثة';
        return;
      }

      chatMessage('جار تحميل الرسائل...');

      const sentRequest = supabaseClient
        .from('messages')
        .select('id, sender_id, content, created_at')
        .eq('sender_id', currentUser.id)
        .eq('receiver_id', receiver);

      const receivedRequest = supabaseClient
        .from('messages')
        .select('id, sender_id, content, created_at')
        .eq('sender_id', receiver)
        .eq('receiver_id', currentUser.id);

      const [sent, received] = await Promise.all([
        sentRequest,
        receivedRequest
      ]);

      if (sent.error || received.error) {
        chatMessage(
          showError('خطأ تحميل الرسائل: ', sent.error || received.error)
        );
        return;
      }

      const messages = [...sent.data, ...received.data];

      messages.sort((a, b) =>
        new Date(a.created_at) - new Date(b.created_at)
      );

      const area = el('chatMessages');
      area.innerHTML = '';

      if (messages.length === 0) {
        area.textContent = 'لا توجد رسائل بعد';
      }

      messages.forEach(msg => {
        const box = document.createElement('div');

        box.className = 'message' +
          (msg.sender_id === currentUser.id ? ' mine' : '');

        const sender = document.createElement('strong');
        sender.textContent =
          msg.sender_id === currentUser.id ? 'أنت' : 'المستخدم الآخر';

        const content = document.createElement('p');
        content.textContent = msg.content;

        const time = document.createElement('small');
        time.textContent =
          new Date(msg.created_at).toLocaleString('ar');

        box.append(sender, content, time);
        area.appendChild(box);
      });

      area.scrollTop = area.scrollHeight;
      chatMessage('تم تحديث المحادثة');
    }

    async function login() {
      const button = el('loginButton');

      button.disabled = true;
      loginMessage('جار تسجيل الدخول...');

      try {
        const email = el('email').value.trim();
        const password = el('password').value;

        if (!email || !password) {
          loginMessage('أدخل البريد الإلكتروني وكلمة المرور');
          return;
        }

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          loginMessage(showError('فشل الدخول: ', error));
          return;
        }

        await showAccount(data.user);

      } catch (error) {
        loginMessage(showError('حدث خطأ: ', error));
      } finally {
        button.disabled = false;
      }
    }

    async function sendMessage() {
      if (!currentUser) return;

      const receiver = el('users').value;
      const content = el('chatInput').value.trim();

      if (!receiver) {
        chatMessage('اختر مستخدماً أولاً');
        return;
      }

      if (!content) {
        chatMessage('اكتب رسالة أولاً');
        return;
      }

      const button = el('sendButton');
      button.disabled = true;
      chatMessage('جار إرسال الرسالة...');

      try {
        const { error } = await supabaseClient
          .from('messages')
          .insert({
            sender_id: currentUser.id,
            receiver_id: receiver,
            content: content
          });

        if (error) {
          chatMessage(showError('فشل الإرسال: ', error));
          return;
        }

        el('chatInput').value = '';
        await loadMessages();
        chatMessage('تم إرسال الرسالة بنجاح');

      } catch (error) {
        chatMessage(showError('حدث خطأ: ', error));
      } finally {
        button.disabled = false;
      }
    }

    async function logout() {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        chatMessage(showError('تعذر تسجيل الخروج: ', error));
        return;
      }

      currentUser = null;
      currentName = '';

      el('account').style.display = 'none';
      el('loginCard').style.display = 'block';

      el('email').value = '';
      el('password').value = '';
      el('users').innerHTML =
        '<option value="">اختر مستخدماً</option>';
      el('chatMessages').innerHTML = '';

      loginMessage('تم تسجيل الخروج');
    }

    async function start() {
      if (!window.supabase) {
        loginMessage('تعذر تحميل مكتبة Supabase. تحقق من الإنترنت.');
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) {
          loginMessage(showError('خطأ الجلسة: ', error));
          return;
        }

        if (data.session) {
0
          await showAccount(data.session.user);
        }

      } catch (error) {
        loginMessage(showError('خطأ تشغيل الموقع: ', error));
      }
    }

    el('loginButton').addEventListener('click', login);
    el('logoutButton').addEventListener('click', logout);
    el('users').addEventListener('change', loadMessages);
    el('sendButton').addEventListener('click', sendMessage);
    el('refreshButton').addEventListener('click', loadMessages);

    start();
  </script>
</body>
</html>
